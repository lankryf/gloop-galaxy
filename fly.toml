app = "gloop-galaxy"
primary_region = "waw"
kill_signal = "SIGTERM"
kill_timeout = 10

[env]
  TRUST_PROXY = "1"
  ALLOWED_ORIGINS = "https://gloop-galaxy.fly.dev"
  HEARTBEAT_MS = "15000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 600
    hard_limit = 750

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
